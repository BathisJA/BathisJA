<svg width="850" height="200" viewBox="0 0 850 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bathistuta Jiwandono Aji — Frontend Developer and Data Science Enthusiast">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="850" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#ff8f40"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#1c2836"/>
    </pattern>
  </defs>

  <rect width="850" height="200" rx="14" fill="url(#bg)"/>
  <rect width="850" height="200" rx="14" fill="url(#dots)"/>
  <rect x="1" y="1" width="848" height="198" rx="13" stroke="#ffb454" stroke-opacity="0.30" stroke-width="1.5"/>

  <!-- window chrome -->
  <circle cx="30" cy="27" r="5" fill="#2a3644"/>
  <circle cx="48" cy="27" r="5" fill="#2a3644"/>
  <circle cx="66" cy="27" r="5" fill="#ffb454"/>
  <text x="820" y="32" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#3d4f63">~/bathisja — zsh</text>

  <!-- prompt -->
  <text x="60" y="66" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" fill="#2dd4bf">$</text>
  <text x="78" y="66" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" fill="#5c718a">whoami</text>

  <!-- name -->
  <text x="58" y="112" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Consolas,monospace" font-size="37" font-weight="700" fill="#e8eef7">BATHISTUTA JIWANDONO AJI</text>

  <!-- blinking cursor -->
  <rect x="592" y="84" width="16" height="32" fill="#ffb454">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- divider with comment -->
  <text x="58" y="142" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Consolas,monospace" font-size="14" fill="#3d4f63">//</text>
  <rect x="80" y="137" width="470" height="2" rx="1" fill="#1c2836"/>

  <!-- subtitle -->
  <text x="58" y="168" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" font-weight="600" fill="#ffb454">frontend developer</text>
  <text x="262" y="168" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" fill="#3d4f63">&amp;&amp;</text>
  <text x="292" y="168" font-family="'Cascadia Code','JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" font-weight="600" fill="#2dd4bf">data science enthusiast</text>

  <!-- data motif: sparkline bars bottom-right -->
  <g>
    <rect x="612" y="150" width="10" height="18" rx="2" fill="#1c2836"/>
    <rect x="628" y="142" width="10" height="26" rx="2" fill="#25506b"/>
    <rect x="644" y="134" width="10" height="34" rx="2" fill="#2dd4bf" fill-opacity="0.55"/>
    <rect x="660" y="126" width="10" height="42" rx="2" fill="#ffb454" fill-opacity="0.55"/>
    <rect x="676" y="118" width="10" height="50" rx="2" fill="url(#amber)"/>
    <polyline points="617,156 633,148 649,140 665,130 681,120" stroke="#e8eef7" stroke-opacity="0.7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="681" cy="120" r="3.5" fill="#ffb454"/>
  </g>
</svg>
